name: Sync contributing document

on:
  push:
    branches: [main]
    paths:
      - 'FOCUSTODO-新时代设计纲领.md'

permissions:
  contents: write

concurrency:
  group: sync-contributing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync and commit changes
        run: |
          cp 'FOCUSTODO-新时代设计纲领.md' docs/CONTRIBUTING.md
          git add docs/CONTRIBUTING.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: sync contributing document [skip ci]'
            git push
          fi
