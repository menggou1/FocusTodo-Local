name: Test and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v6
        if: matrix.node == '24'
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:release
      - name: Verify generated files are committed
        run: git diff --exit-code -- package.json package-lock.json index.html js/local-release.js js/local-i18n-catalog.js
      - run: npm run check
      - run: npm test
      - name: Install browser
        if: matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - name: Prepare Windows TCP resources for full browser acceptance
        if: runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        run: ./scripts/windows-ci-network.ps1 -Configure -Phase before
      - name: Browser acceptance
        if: matrix.node == '24'
        run: npm run test:browser
        env:
          FOCUS_TEST_BUNDLED_BROWSER: '1'
      - name: Record Windows TCP resources after browser acceptance
        if: always() && runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        run: ./scripts/windows-ci-network.ps1 -Phase after
      - name: Package runtime
        if: matrix.node == '24'
        run: |
          python tests/release-gate-test.py
          python scripts/package-release.py
      - name: Test extracted ZIP and tar.gz without dependencies
        if: matrix.node == '24'
        run: python tests/package-smoke.py
      - name: Upload browser evidence
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ matrix.os }}
          path: docs/acceptance/
          retention-days: 7

  release:
    name: Publish version tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a commit merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require successful main tests and Pages deployment
        run: python scripts/verify-release-workflows.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build portable archives and verify tag
        run: python scripts/package-release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish release and assets
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt
          --verify-tag --title "FocusTodo $RELEASE_TAG"
          --notes-file dist/release-notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
