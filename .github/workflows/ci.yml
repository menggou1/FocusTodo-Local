name: Test, deploy and release

on:
  push:
    branches: ['**']
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel for a version tag (stable only after acceptance)'
        type: choice
        options: [prerelease, stable]
        default: prerelease

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type == 'tag' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.event_name == 'pull_request' && 'latest' || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select test scope
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$PR_BASE" ]]; then
            git diff --name-only -z --no-renames "$PR_BASE" HEAD > "$RUNNER_TEMP/changed-paths"
            full=false
            while IFS= read -r -d '' file; do
              case "$file" in
                README.md|README_en.md|AGENTS.md|docs/*) ;;
                *) full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:release
      - name: Verify generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - run: npm run check
      - run: python tests/release/release-gate-test.py
      - run: python tests/release/pages-build-test.py
      - name: Build archives and verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/package-release.py --tag "$RELEASE_TAG"
            python scripts/verify-release-workflows.py "$RELEASE_TAG" dist
          else
            python scripts/package-release.py
          fi
      - name: Check documentation and start both archives on documentation-only PRs
        if: steps.scope.outputs.full == 'false'
        run: python tests/release/package-smoke.py
      - name: Share the same archives across operating systems
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: portable-test-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  test:
    needs: preflight
    if: needs.preflight.outputs.full == 'true'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v6
        if: matrix.node == '24'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        if: matrix.node == '24'
        with:
          name: portable-test-archives
          path: dist
      - name: Test extracted ZIP and tar.gz without dependencies
        if: matrix.node == '24'
        run: python tests/release/package-smoke.py
      - name: Install browser
        if: matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - name: Prepare Windows TCP resources
        if: runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        env:
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
        run: ./scripts/windows-ci-network.ps1 -Configure -Phase before
      - name: Browser acceptance
        if: matrix.node == '24'
        run: npm run test:browser
        env:
          FOCUS_TEST_BUNDLED_BROWSER: '1'
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
      - name: Install Firefox and WebKit compatibility engines
        if: runner.os == 'Linux' && matrix.node == '24'
        run: npx playwright install --with-deps firefox webkit
      - name: Capability fallback in Firefox and WebKit
        if: runner.os == 'Linux' && matrix.node == '24'
        run: npm run test:compat
        env:
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
      - name: Record Windows TCP resources
        if: always() && runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        env:
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
        run: ./scripts/windows-ci-network.ps1 -Phase after
      - name: Upload browser evidence
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/acceptance/
          overwrite: true
          retention-days: 7

  pages-build:
    needs: [preflight, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build only committed browser runtime files
        run: python scripts/deploy-pages.py --ref HEAD --output dist/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    name: Deploy GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to overwrite Pages with a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Main advanced to $current; refusing to deploy $GITHUB_SHA."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish version tag
    needs: [preflight, test]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: portable-test-archives
          path: dist
      - name: Verify tested assets, version and unchanged tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify-release-workflows.py "$RELEASE_TAG" dist
          remote_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          if [[ -z "$remote_sha" ]]; then remote_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1); fi
          test "$remote_sha" = "$(git rev-parse HEAD)"
      - name: Publish or explicitly promote verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'prerelease' }}
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-error"; then
            if [[ "$CHANNEL" != stable ]] || ! python -c "import json,sys; r=json.load(open(sys.argv[1])); sys.exit(not (r['prerelease'] and not r['draft']))" "$RUNNER_TEMP/existing-release.json"; then
              echo 'Release already exists; refusing to overwrite it.'; exit 1
            fi
            mkdir "$RUNNER_TEMP/published-assets"
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published-assets"
            python scripts/verify-release-workflows.py "$RELEASE_TAG" "$RUNNER_TEMP/published-assets" --reference dist
            gh release edit "$RELEASE_TAG" --prerelease=false --latest=false
          else
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-error"; then cat "$RUNNER_TEMP/release-error"; exit 1; fi
            flags=(--prerelease --latest=false)
            if [[ "$CHANNEL" == stable ]]; then flags=(--latest=false); fi
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
              --verify-tag --title "FocusTodo $RELEASE_TAG" --notes-file dist/release-notes.md "${flags[@]}"
          fi
