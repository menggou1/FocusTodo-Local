name: Test, deploy and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select test scope
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$PR_BASE" ]]; then
            git diff --name-only -z --no-renames "$PR_BASE" HEAD > "$RUNNER_TEMP/changed-paths"
            full=false
            while IFS= read -r -d '' file; do
              case "$file" in
                README.md|README_en.md|AGENTS.md|docs/*) ;;
                *) full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:release
      - name: Verify generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - run: npm run check
      - run: python tests/release/release-gate-test.py
      - run: python tests/release/pages-build-test.py
      - run: python scripts/package-release.py
      - name: Check documentation and start both archives on documentation-only PRs
        if: steps.scope.outputs.full == 'false'
        run: python tests/release/package-smoke.py
      - name: Share the same archives across operating systems
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: portable-test-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  test:
    needs: preflight
    if: needs.preflight.outputs.full == 'true'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v6
        if: matrix.node == '24'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        if: matrix.node == '24'
        with:
          name: portable-test-archives
          path: dist
      - name: Test extracted ZIP and tar.gz without dependencies
        if: matrix.node == '24'
        run: python tests/release/package-smoke.py
      - name: Install browser
        if: matrix.node == '24'
        run: npx playwright install --with-deps chromium
      - name: Prepare Windows TCP resources
        if: runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        run: ./scripts/windows-ci-network.ps1 -Configure -Phase before
      - name: Browser acceptance
        if: matrix.node == '24'
        run: npm run test:browser
        env:
          FOCUS_TEST_BUNDLED_BROWSER: '1'
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
      - name: Record Windows TCP resources
        if: always() && runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        run: ./scripts/windows-ci-network.ps1 -Phase after
      - name: Upload browser evidence
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/acceptance/
          overwrite: true
          retention-days: 7

  pages-build:
    needs: [preflight, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build only committed browser runtime files
        run: python scripts/deploy-pages.py --ref HEAD --output dist/pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    name: Deploy GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to overwrite Pages with a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Main advanced to $current; refusing to deploy $GITHUB_SHA."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish version tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require a commit merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require successful main tests and Pages deployment
        run: python scripts/verify-release-workflows.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build portable archives and verify tag
        run: python scripts/package-release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish release and assets
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt
          --verify-tag --title "FocusTodo $RELEASE_TAG"
          --notes-file dist/release-notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
