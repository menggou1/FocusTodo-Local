name: Test, deploy and release

on:
  push:
    branches: ['**']
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel for a version tag'
        type: choice
        options: [stable, prerelease]
        default: stable

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type == 'tag' && github.ref || format('{0}-{1}-{2}', github.event_name, github.ref, github.event_name == 'pull_request' && 'latest' || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.scope.outputs.full }}
      reused: ${{ steps.reuse.outputs.reused }}
      reused_run_id: ${{ steps.reuse.outputs.run_id }}
      reused_artifact_id: ${{ steps.reuse.outputs.artifact_id }}
      reused_artifact_digest: ${{ steps.reuse.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag version identity
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          version = json.loads(Path('release.json').read_text(encoding='utf-8'))['localVersion']
          if tag != version:
              raise SystemExit(f'Tag {tag!r} must match localVersion {version!r}')
          PY
      - name: Check release branch version identity
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          branch = os.environ['GITHUB_REF']
          version = json.loads(Path('release.json').read_text(encoding='utf-8'))['localVersion']
          if branch != f'refs/heads/release/{version}':
              raise SystemExit(f'Release branch {branch!r} must match localVersion {version!r}')
          PY
      - name: Select test scope
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$PR_BASE" ]]; then
            git diff --name-only -z --no-renames "$PR_BASE" HEAD > "$RUNNER_TEMP/changed-paths"
            full=false
            while IFS= read -r -d '' file; do
              case "$file" in
                README.md|README_en.md|AGENTS.md|docs/*) ;;
                *) full=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check main production version
        if: github.ref == 'refs/heads/main'
        run: python scripts/deploy-pages.py --ref "$GITHUB_SHA" --check-main-version
      - run: npm ci
      - run: npm run build:release
      - name: Verify generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - run: npm run check
      - name: Build production React application
        run: npm run build
      - name: Build and package the isolated application
        run: |
          npm run build:standalone
          npm run package:standalone
      - run: python tests/release/release-gate-test.py
      - run: python tests/release/ci-validation-test.py
      - run: python tests/release/pages-build-test.py
      - name: Build archives and verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/package-release.py --tag "$RELEASE_TAG"
            python scripts/verify-release-workflows.py "$RELEASE_TAG" dist
          else
            python scripts/package-release.py
          fi
      - name: Restore original tested archives for this exact commit when available
        id: reuse
        if: steps.scope.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-validation.py reuse
      - name: Start both archives on documentation-only or verified reuse runs
        if: steps.scope.outputs.full == 'false' || steps.reuse.outputs.reused == 'true'
        run: python tests/release/package-smoke.py
      - name: Share the same archives across operating systems
        if: steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-test-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Share the isolated preview across operating systems
        if: steps.scope.outputs.full == 'true' && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standalone-preview-test
          path: |
            dist/standalone/site/
            dist/standalone/FocusTodo-standalone-prototype.zip
            dist/standalone/FocusTodo-standalone-prototype.tar.gz
            dist/standalone/prototype-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  test:
    needs: preflight
    if: needs.preflight.outputs.full == 'true' && needs.preflight.outputs.reused != 'true'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.playwright_image }}
      options: --ipc=host
    timeout-minutes: ${{ matrix.playwright_image && 30 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        include:
          - os: ubuntu-latest
            node: '24'
            playwright_image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the verified container checkout for this job
        if: matrix.playwright_image
        shell: bash
        run: |
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          test "$workspace" = "$(pwd -P)"
          test -d "$workspace/.git" && test ! -L "$workspace/.git" || exit 1
          test "$(git -c "safe.directory=$workspace" rev-parse --show-toplevel)" = "$workspace"
          test "$(git -c "safe.directory=$workspace" rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=safe.directory'
            printf 'GIT_CONFIG_VALUE_0=%s\n' "$workspace"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: b0ee5e26c133ea273e1634fa52b8a107e1649a69
          path: .legacy-oracle
          persist-credentials: false
      - name: Locate immutable historical test oracle
        shell: bash
        run: printf 'FOCUS_LEGACY_ROOT=%s/.legacy-oracle\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12'
      - run: npm test
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Standalone contracts and isolated server
        run: node --test tests/standalone/*.test.cjs
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: matrix.node == '24'
        with:
          name: portable-test-archives
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: matrix.node == '24'
        with:
          name: standalone-preview-test
          path: dist/standalone
      - name: Test extracted ZIP and tar.gz without dependencies
        if: matrix.node == '24'
        run: python tests/release/package-smoke.py
      - name: Verify preinstalled Linux browser version
        if: matrix.playwright_image
        shell: bash
        env:
          PLAYWRIGHT_IMAGE: ${{ matrix.playwright_image }}
        run: |
          version=$(node -p 'require("playwright/package.json").version')
          if [[ "${PLAYWRIGHT_IMAGE%@*}" != "mcr.microsoft.com/playwright:v$version-resolute" ||
                ! "${PLAYWRIGHT_IMAGE##*@}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Update the CI browser image to match Playwright $version."
            exit 1
          fi
      - name: Install Chromium headless shell on Windows and macOS
        if: matrix.node == '24' && runner.os != 'Linux'
        timeout-minutes: 6
        run: node node_modules/playwright/cli.js install --only-shell chromium
      - name: Record Windows TCP resources before browser tests
        if: runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        env:
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
        run: ./scripts/windows-ci-network.ps1 -Phase before
      - name: Browser acceptance
        if: matrix.node == '24'
        run: npm run test:browser
        env:
          FOCUS_TEST_BUNDLED_BROWSER: '1'
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
      - name: Standalone Chromium and both extracted preview archives
        if: matrix.node == '24'
        shell: bash
        run: |
          node tests/standalone/browser-acceptance.cjs
          node tests/standalone/workspace-browser.cjs
          node tests/standalone/domain-pages.cjs
          node tests/standalone/services-browser.cjs
          node tests/standalone/package-smoke.cjs
          npm run test:release-app
          node tests/standalone/ui-font-readiness.cjs
          node tests/standalone/final-ui-parity.cjs
          node tests/standalone/folder-composer-parity.cjs
          node tests/standalone/inspector-dialog-parity.cjs
          node tests/standalone/about-settings.cjs
          node tests/standalone/settings-legacy-reference.cjs
          node tests/standalone/settings-regression.cjs
        env:
          FOCUS_TEST_BUNDLED_BROWSER: '1'
          FOCUS_STANDALONE_ENGINES: chromium
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance/standalone-chromium
      - name: Capability fallback in Firefox and WebKit
        if: runner.os == 'Linux' && matrix.node == '24'
        shell: bash
        run: npm run test:compat
        env:
          HOME: /root
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
      - name: Standalone Firefox and WebKit
        if: runner.os == 'Linux' && matrix.node == '24'
        shell: bash
        run: |
          node tests/standalone/browser-acceptance.cjs
          node tests/standalone/workspace-browser.cjs
          node tests/standalone/domain-pages.cjs
          node tests/standalone/services-browser.cjs
          node tests/standalone/settings-regression.cjs
        env:
          HOME: /root
          FOCUS_STANDALONE_ENGINES: firefox,webkit
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance/standalone-firefox-webkit
      - name: Record Windows TCP resources
        if: always() && runner.os == 'Windows' && matrix.node == '24'
        shell: pwsh
        env:
          FOCUS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
        run: ./scripts/windows-ci-network.ps1 -Phase after
      - name: Upload browser evidence
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/acceptance/
          overwrite: true
          retention-days: 7

  validation:
    needs: [preflight, test]
    if: always()
    name: Verify CI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require successful checks or verified exact-commit evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FULL: ${{ needs.preflight.outputs.full }}
          REUSED: ${{ needs.preflight.outputs.reused }}
          REUSED_RUN_ID: ${{ needs.preflight.outputs.reused_run_id }}
          REUSED_ARTIFACT_ID: ${{ needs.preflight.outputs.reused_artifact_id }}
          REUSED_ARTIFACT_DIGEST: ${{ needs.preflight.outputs.reused_artifact_digest }}
        run: python scripts/ci-validation.py gate

  pages-build:
    needs: [preflight, validation]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.validation.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build only committed browser runtime files
        run: python scripts/deploy-pages.py --ref HEAD --output dist/pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages

  deploy:
    name: Deploy GitHub Pages
    needs: pages-build
    if: ${{ !cancelled() && needs.pages-build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Recheck main production version immediately before deployment
        run: python scripts/deploy-pages.py --ref "$GITHUB_SHA" --check-main-version
      - name: Refuse to overwrite Pages with a superseded main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Main advanced to $current; refusing to deploy $GITHUB_SHA."
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    name: Publish version tag
    needs: [preflight, validation]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.validation.result == 'success' && github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portable-test-archives
          path: dist
      - name: Verify tested assets, version and unchanged tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify-release-workflows.py "$RELEASE_TAG" dist
          remote_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          if [[ -z "$remote_sha" ]]; then remote_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1); fi
          test "$remote_sha" = "$(git rev-parse HEAD)"
      - name: Publish or explicitly promote verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'stable' }}
        run: |
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-error"; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$CHANNEL" != stable ]] || ! python -c "import json,sys; r=json.load(open(sys.argv[1])); sys.exit(not (r['prerelease'] and not r['draft']))" "$RUNNER_TEMP/existing-release.json"; then
              echo 'Release already exists; refusing to overwrite it.'; exit 1
            fi
            mkdir "$RUNNER_TEMP/published-assets"
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published-assets"
            python scripts/verify-release-workflows.py "$RELEASE_TAG" "$RUNNER_TEMP/published-assets" --reference dist
            gh release edit "$RELEASE_TAG" --prerelease=false --latest
          else
            if ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-error"; then cat "$RUNNER_TEMP/release-error"; exit 1; fi
            flags=(--latest)
            if [[ "$CHANNEL" == prerelease ]]; then flags=(--prerelease --latest=false); fi
            release_source=$(python scripts/verify-release-workflows.py "$RELEASE_TAG" --check-release-head)
            printf '%s\n' "$release_source" >> "$GITHUB_STEP_SUMMARY"
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
              --verify-tag --title "FocusTodo $RELEASE_TAG" --notes-file dist/release-notes.md "${flags[@]}"
          fi
